<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Performance — SmartFlow Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">SmartFlow <span>Agency</span> · Performance</div>
    <nav class="views">
      <a href="index.html" class="active">Agent</a>
      <a href="manager.html">Manager</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div id="identify" class="identify">
    <p class="eyebrow">Agent Performance</p>
    <h1>Enter your agent code</h1>
    <p>See your own numbers for the current month. No one else's.</p>
    <form id="identify-form">
      <input id="code-input" type="text" placeholder="e.g. MP120" autocomplete="off" autocapitalize="characters">
      <button type="submit">View</button>
    </form>
    <div class="err" id="identify-err"></div>
  </div>

  <div id="dashboard" style="display:none"></div>
</main>

<footer>Data as of <span id="footer-date">—</span> · SmartFlow Agency internal tool</footer>

<script src="app.js"></script>
<script src="agent.js"></script>
</body>
</html>
